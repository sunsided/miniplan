[package]
name = "miniplan-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Separate workspace: keeps the nightly-only fuzz crate out of the root workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"

[dependencies.miniplan]
path = "../crates/miniplan"

[[bin]]
name = "load_ground_solve"
path = "fuzz_targets/load_ground_solve.rs"
test = false
doc = false
bench = false
