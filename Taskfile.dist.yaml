version: "3"

vars:
  CARGO: cargo

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  fmt:
    desc: Apply Rust formatting
    aliases:
      - fmt:fix
    cmds:
      - "{{.CARGO}} fmt"

  fmt:check:
    desc: Check Rust formatting
    cmds:
      - "{{.CARGO}} fmt -- --check"

  check:
    desc: Check the workspace
    cmds:
      - "{{.CARGO}} check"

  check:all:
    desc: Check the workspace with all targets
    cmds:
      - "{{.CARGO}} check --all-targets"

  lint:
    desc: Check clippy lints for all targets
    aliases:
      - lint:check
    cmds:
      - "{{.CARGO}} clippy --all-targets"

  lint:fix:
    desc: Apply clippy fixes
    aliases:
      - clippy
    cmds:
      - "{{.CARGO}} clippy --fix --allow-dirty --all-targets"

  build:
    desc: Build the workspace
    cmds:
      - "{{.CARGO}} build"

  test:
    desc: Run all tests
    aliases:
      - test:all
    cmds:
      - "{{.CARGO}} test --all-features"

  test:lib:
    desc: Run library tests only
    cmds:
      - "{{.CARGO}} test -p miniplan --all-features"

  test:cli:
    desc: Run CLI tests only
    cmds:
      - "{{.CARGO}} test -p miniplan-cli"

  verify:
    desc: Run formatting checks, static checks, clippy, and tests
    deps:
      - fmt:check
      - check:all
      - lint:check
      - test

  clean:
    desc: Remove Cargo build artifacts
    cmds:
      - "{{.CARGO}} clean"

  example:all:
    desc: Run all example problems with their default planner
    aliases:
      - example
      - examples
    cmds:
       - task: example:blocksworld
         vars:
           PLANNER: astar
       - task: example:gripper-small
         vars:
           PLANNER: bfs
       - task: example:gripper:astar
       - task: example:logistics
         vars:
           PLANNER: bfs
       - task: example:air-cargo:astar
       - task: example:compare
       - task: example:air-cargo:showoff
       - task: example:gripper:bidij

  example:blocksworld:
    desc: Solve the blocksworld-4 problem (4 blocks, tower stacking)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/blocksworld.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc]
    vars:
      PLANNER: '{{.PLANNER | default "astar"}}'

  example:gripper-small:
    desc: Solve the gripper-2 problem (2 balls, smoke test)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/gripper-small.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc]
    vars:
      PLANNER: '{{.PLANNER | default "bfs"}}'

  example:gripper:
    desc: Solve the gripper-4 problem (4 balls, 8 objects, 36 operators)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/gripper.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc]
    vars:
      PLANNER: '{{.PLANNER | default "astar"}}'

  example:gripper:bfs:
    desc: Solve gripper-4 with BFS (optimal, explores ~370 nodes)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bfs --stats examples/pddl/gripper.pddl"

  example:gripper:astar:
    desc: Solve gripper-4 with A* + hFF (optimal, explores ~158 nodes, slower per-node)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"

  example:gripper:bidij:
    desc: Solve gripper-4 with BiDij (Bidirectional Dijkstra, cost-aware optimal)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --stats examples/pddl/gripper.pddl"

  example:logistics:
    desc: Solve the logistics-simple problem (2 packages, 2 locations)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/logistics.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc]
    vars:
      PLANNER: '{{.PLANNER | default "bfs"}}'

  example:air-cargo:
    desc: Solve the air-cargo-p3 problem (4 cargo, 2 planes, 4 airports)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc]
    vars:
      PLANNER: '{{.PLANNER | default "astar"}}'

  example:air-cargo:gbfs:
    desc: Solve air-cargo-p3 with GBFS (fast, non-optimal)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner gbfs --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:astar:
    desc: "Solve air-cargo-p3 with A* + hFF (optimal: 13 actions)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:bidij:
    desc: "Solve air-cargo-p3 with BiDij (Bidirectional Dijkstra, cost-aware optimal)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:showoff:
    desc: "Air Cargo P3 - GBFS (fast, non-optimal) vs A*+hFF (optimal: 13 actions, slower)"
    cmds:
      - 'echo "=== GBFS + hFF (fast, NON-optimal on this problem) ==="'
      - "{{.CARGO}} run --bin miniplan -- solve --planner gbfs --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"
      - 'echo ""'
      - 'echo "=== A* + hFF (optimal: 13 actions, slower) ==="'
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:compare:
    desc: Solve gripper-4 with BFS and A* side by side
    cmds:
      - echo "=== BFS (optimal, more nodes expanded) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bfs --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== A* + hFF (optimal, fewer nodes, higher per-node cost) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"

  example:compare:bidij:
    desc: Solve gripper-4 with A* and BiDij side by side
    cmds:
      - echo "=== A* + hFF (optimal, forward-only) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== BiDij (Bidirectional Dijkstra, cost-aware optimal) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --stats examples/pddl/gripper.pddl"

  example:check:
    desc: Ground all example problems without searching
    cmds:
      - ls examples/pddl/*.pddl | xargs -I {} sh -c 'echo "--- {} ---"; {{.CARGO}} run --bin miniplan -- check "{}"; echo ""'
