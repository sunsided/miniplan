# https://taskfile.dev
# Keep `ci` in sync with .github/workflows/ci.yml: same checks, same flags.
version: '3'

includes:
  fuzz:
    taskfile: fuzz/Taskfile.dist.yaml
    dir: fuzz
    optional: true

vars:
  CARGO: cargo
  # Prefer cargo-nextest when installed; fall back to cargo test.
  NEXTEST:
    sh: cargo nextest --version >/dev/null 2>&1 && echo yes || echo no
  # Doctests need a library target; binary-only crates have none.
  HAS_LIB:
    sh: cargo metadata --no-deps --format-version 1 | grep -qE '"kind":\[[^]]*"(lib|rlib|proc-macro)"' && echo yes || echo no
  # Branching model checked by lint:branch: github (main + feature/) or gitflow.
  BRANCH_FLOW: github

env:
  # Newer nextest fails when a crate has no tests; warn instead (ignored by older versions).
  NEXTEST_NO_TESTS: warn

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list --sort=none
    silent: true

  build:
    desc: Build all targets in the workspace
    cmds:
      - cargo build --workspace --all-targets --all-features {{.CLI_ARGS}}

  test:
    desc: Run tests (nextest if installed, cargo test otherwise), then doctests
    aliases: [test:all]
    cmds:
      - cmd: cargo nextest run --workspace --all-features {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "yes" ]'
      - cmd: cargo test --workspace --all-targets --all-features {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "no" ]'
      - task: test:doc

  test:doc:
    desc: Run doctests (nextest does not run them; skipped for binary-only crates)
    aliases: [test:docs]
    cmds:
      - cmd: cargo test --workspace --all-features --doc
        if: '[ "{{.HAS_LIB}}" = "yes" ]'

  test:prop:
    desc: Run property tests with a high case count (PROPTEST_CASES, default 10000)
    env:
      PROPTEST_CASES: '{{.PROPTEST_CASES | default "10000"}}'
    cmds:
      # A nested `task` process inherits env; `task: test` would not.
      - task test

  fmt:
    desc: Format all Rust sources
    aliases: [fmt:fix]
    cmds:
      - cargo fmt --all
      - task: fuzz:fmt

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - cargo fmt --all --check

  lint:
    desc: Run all linters
    cmds:
      - task: lint:clippy
      - task: lint:separators
      - task: lint:readme
      - task: lint:typos
      - task: lint:mermaid
      - task: lint:review
      - task: lint:actions

  lint:clippy:
    desc: Clippy (pedantic, warnings as errors)
    aliases: [lint:check]
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:fix:
    desc: Auto-fix clippy findings and typos, then format (review the diff)
    aliases: [clippy]
    cmds:
      - cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
      - typos --write-changes
      - task: fmt

  lint:separators:
    desc: Fail on `// ----` style separator comments (split the file into modules instead)
    cmds:
      - "! grep -rnE --include='*.rs' --exclude-dir=target --exclude-dir=.git '^[[:space:]]*//+[[:space:]]*[-=*#~_/]{4,}' ."

  lint:readme:
    desc: Fail on relative links or images in README files (crates.io needs absolute URLs)
    cmds:
      # `if` instead of `! a | b`: Task's shell does not negate pipelines like bash does.
      - |
        # docs/review/README.md is a GitHub-only index with generated relative links.
        if grep -rnoE --include='README.md' --exclude-dir=target --exclude-dir=.git --exclude-dir=review '(\]\(|src=")[^)"]*' . \
          | grep -vE ':(\]\(|src=")(https?://|#|mailto:)'; then
          echo "use absolute URLs for these links (docs/readme.md)"
          exit 1
        fi

  lint:typos:
    desc: Spell-check code and docs
    preconditions:
      - sh: command -v typos
        msg: "typos not found - cargo install --locked typos-cli"
    cmds:
      - typos

  lint:mermaid:
    desc: Render every mermaid diagram (Markdown and doc comments) to catch broken ones
    cmds:
      # Passes without mermaid-cli when there are no diagrams; set MMDC to override the command.
      - python3 scripts/lint-mermaid.py

  lint:review:
    desc: Check that docs/review/ index and generated Copilot instructions are current
    cmds:
      - python3 scripts/review-index.py --check

  review:index:
    desc: Regenerate docs/review/README.md and .github/instructions/ from the review topics
    cmds:
      - python3 scripts/review-index.py

  lint:branch:
    desc: Check the branch name against the branching model (BRANCH=..., default current)
    cmds:
      - sh scripts/check-branch.sh "{{.BRANCH}}" "{{.BRANCH_FLOW}}"

  lint:actions:
    desc: Lint GitHub Actions workflows (actionlint + zizmor)
    preconditions:
      - sh: command -v actionlint
        msg: "actionlint not found - https://github.com/rhysd/actionlint/blob/main/docs/install.md"
      - sh: command -v zizmor
        msg: "zizmor not found - https://docs.zizmor.sh/installation/"
    cmds:
      - actionlint
      - zizmor .github/

  doc:
    desc: Build docs including private items, warnings as errors (mermaid diagrams rendered)
    aliases: [docs]
    env:
      RUSTDOCFLAGS: -D warnings --html-in-header {{.ROOT_DIR}}/docs/mermaid.html
    cmds:
      - cargo doc --workspace --all-features --no-deps --document-private-items

  deny:
    desc: Check advisories, licenses, bans and sources
    preconditions:
      - sh: cargo deny --version
        msg: "cargo-deny not found - cargo install --locked cargo-deny"
    cmds:
      - cargo deny --all-features check

  msrv:
    desc: Check every crate on its declared rust-version
    preconditions:
      - sh: cargo hack --version
        msg: "cargo-hack not found - cargo install --locked cargo-hack"
    cmds:
      - cargo hack check --rust-version --workspace --all-targets --ignore-private

  semver:
    desc: Check published library crates for semver violations
    preconditions:
      - sh: cargo semver-checks --version
        msg: "cargo-semver-checks not found - cargo install --locked cargo-semver-checks"
    cmds:
      - cargo semver-checks --workspace

  coverage:
    desc: Coverage report (lcov.info, gitignored; HTML with -- --html)
    preconditions:
      - sh: cargo llvm-cov --version
        msg: "cargo-llvm-cov not found - cargo install --locked cargo-llvm-cov"
    cmds:
      - cmd: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "yes" ]'
      - cmd: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info {{.CLI_ARGS}}
        if: '[ "{{.NEXTEST}}" = "no" ]'

  bench:
    desc: "Run benchmarks (criterion flags after --: task bench -- --quick)"
    cmds:
      # --bench '*': only [[bench]] targets (--benches would include lib harnesses that reject criterion flags).
      - cargo bench --workspace --bench '*' -- {{.CLI_ARGS}}

  dist:
    desc: Build the release binary with cargo auditable (dependency tree embedded)
    preconditions:
      - sh: cargo auditable --version
        msg: "cargo-auditable not found - cargo install --locked cargo-auditable"
    cmds:
      - cargo auditable build --release {{.CLI_ARGS}}

  dist:sbom:
    desc: "Write a CycloneDX SBOM extracted from a built binary (BIN=name)"
    requires:
      vars: [BIN]
    preconditions:
      - sh: command -v auditable2cdx
        msg: "auditable2cdx not found - cargo install --locked auditable2cdx"
    deps: [dist]
    cmds:
      - auditable2cdx target/release/{{.BIN}} > target/release/{{.BIN}}.cdx.json

  ci:
    desc: Run the CI checks locally (mirrors .github/workflows/ci.yml)
    cmds:
      - task: lint:branch
      - task: fmt:check
      - task: lint
      - task: doc
      - task: test
      - task: deny
      - task: msrv
      - task: fuzz:build
      - task: fuzz:lint

  clean:
    desc: Remove build output, including fuzz builds (keeps fuzz corpora and crash artifacts)
    cmds:
      - cargo clean
      - task: fuzz:clean
      - rm -f lcov.info

  check:
    desc: Check the workspace
    cmds:
      - "{{.CARGO}} check"

  check:all:
    desc: Check the workspace with all targets
    cmds:
      - "{{.CARGO}} check --all-targets"


  test:lib:
    desc: Run library tests only
    cmds:
      - "{{.CARGO}} test -p miniplan --all-features"

  test:cli:
    desc: Run CLI tests only
    cmds:
      - "{{.CARGO}} test -p miniplan-cli"

  verify:
    desc: Run formatting checks, static checks, clippy, and tests
    deps:
      - fmt:check
      - check:all
      - lint:check
      - test


  example:all:
    desc: Run all example problems with their default planner
    aliases:
      - example
      - examples
    cmds:
      - task: example:blocksworld
        vars:
          PLANNER: astar
      - task: example:gripper-small
        vars:
          PLANNER: bfs
      - task: example:gripper:astar
      - task: example:logistics
        vars:
          PLANNER: bfs
      - task: example:air-cargo:astar
      - task: example:compare
      - task: example:air-cargo:showoff
      - task: example:gripper:bidij
      - task: example:gripper:nbs
      - task: example:air-cargo:nbs
      - task: example:gripper:bae
      - task: example:air-cargo:bae
      - task: example:gripper:nbs:zero
      - task: example:gripper:nbs:hmax
      - task: example:gripper:bae:zero
      - task: example:gripper:bae:hmax
      - task: example:air-cargo:gbfs
      - task: example:air-cargo:bidij
      - task: example:air-cargo:nbs:zero
      - task: example:air-cargo:bae:zero
      - task: example:compare:bidij
      - task: example:compare:nbs
      - task: example:compare:nbs-heuristics
      - task: example:compare:bae-heuristics

  example:blocksworld:
    desc: Solve the blocksworld-4 problem (4 blocks, tower stacking)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/blocksworld.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc, nbs, bae]
    vars:
      PLANNER: '{{.PLANNER | default "astar"}}'

  example:gripper-small:
    desc: Solve the gripper-2 problem (2 balls, smoke test)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/gripper-small.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc, nbs, bae]
    vars:
      PLANNER: '{{.PLANNER | default "bfs"}}'

  example:gripper:
    desc: Solve the gripper-4 problem (4 balls, 8 objects, 36 operators)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/gripper.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc, nbs, bae]
    vars:
      PLANNER: '{{.PLANNER | default "astar"}}'

  example:gripper:bfs:
    desc: Solve gripper-4 with BFS (optimal, explores ~370 nodes)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bfs --stats examples/pddl/gripper.pddl"

  example:gripper:astar:
    desc: Solve gripper-4 with A* + hFF (optimal, explores ~158 nodes, slower per-node)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"

  example:gripper:bidij:
    desc: Solve gripper-4 with BiDij (Bidirectional Dijkstra, cost-aware optimal)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --stats examples/pddl/gripper.pddl"

  example:gripper:nbs:
    desc: Solve gripper-4 with NBS (Near-Optimal Bidirectional Search, Chen et al. 2017)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --stats examples/pddl/gripper.pddl"

  example:gripper:nbs:zero:
    desc: Solve gripper-4 with NBS + h=0 (degenerates to bidirectional uniform-cost search)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --heuristic zero --stats examples/pddl/gripper.pddl"

  example:gripper:nbs:hmax:
    desc: Solve gripper-4 with NBS + hMax (admissible, provably optimal)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --heuristic hmax --stats examples/pddl/gripper.pddl"

  example:gripper:bae:
    desc: Solve gripper-4 with BAE* (Bidirectional A* with Error, Sadhukhan 2013)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --stats examples/pddl/gripper.pddl"

  example:gripper:bae:zero:
    desc: Solve gripper-4 with BAE* + h=0 (degenerates to bidirectional uniform-cost search)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --heuristic zero --stats examples/pddl/gripper.pddl"

  example:gripper:bae:hmax:
    desc: Solve gripper-4 with BAE* + hMax (admissible heuristics both directions)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --heuristic hmax --stats examples/pddl/gripper.pddl"

  example:logistics:
    desc: Solve the logistics-simple problem (2 packages, 2 locations)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --stats examples/pddl/logistics.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc, nbs, bae]
    vars:
      PLANNER: '{{.PLANNER | default "bfs"}}'

  example:air-cargo:
    desc: Solve the air-cargo-p3 problem (4 cargo, 2 planes, 4 airports)
    cmds:
      - cmd: '{{.CARGO}} run --bin miniplan -- solve --planner {{.PLANNER}} --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl'
    requires:
      vars:
        - name: PLANNER
          enum: [bfs, astar, gbfs, bidij, bibfs-uc, nbs, bae]
    vars:
      PLANNER: '{{.PLANNER | default "astar"}}'

  example:air-cargo:gbfs:
    desc: Solve air-cargo-p3 with GBFS (fast, non-optimal)
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner gbfs --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:astar:
    desc: "Solve air-cargo-p3 with A* + hFF (optimal: 13 actions)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:bidij:
    desc: "Solve air-cargo-p3 with BiDij (Bidirectional Dijkstra, cost-aware optimal)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:nbs:
    desc: "Solve air-cargo-p3 with NBS (Near-Optimal Bidirectional Search, Chen et al. 2017)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:nbs:zero:
    desc: "Solve air-cargo-p3 with NBS + h=0 (degenerates to bidirectional uniform-cost search)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --heuristic zero --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:bae:
    desc: "Solve air-cargo-p3 with BAE* (Bidirectional A* with Error, Sadhukhan 2013)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:bae:zero:
    desc: "Solve air-cargo-p3 with BAE* + h=0 (degenerates to bidirectional uniform-cost search)"
    cmds:
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --heuristic zero --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:air-cargo:showoff:
    desc: "Air Cargo P3 - GBFS (fast, non-optimal) vs A*+hFF (optimal: 13 actions, slower)"
    cmds:
      - 'echo "=== GBFS + hFF (fast, NON-optimal on this problem) ==="'
      - "{{.CARGO}} run --bin miniplan -- solve --planner gbfs --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"
      - 'echo ""'
      - 'echo "=== A* + hFF (optimal: 13 actions, slower) ==="'
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --problem air-cargo-p3 --stats examples/pddl/air-cargo.pddl"

  example:compare:
    desc: Solve gripper-4 with BFS and A* side by side
    cmds:
      - echo "=== BFS (optimal, more nodes expanded) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bfs --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== A* + hFF (optimal, fewer nodes, higher per-node cost) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"

  example:compare:bidij:
    desc: Solve gripper-4 with A* and BiDij side by side
    cmds:
      - echo "=== A* + hFF (optimal, forward-only) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== BiDij (Bidirectional Dijkstra, cost-aware optimal) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --stats examples/pddl/gripper.pddl"

  example:compare:nbs:
    desc: Solve gripper-4 with A*, BiDij, NBS, and BAE* side by side
    cmds:
      - echo "=== A* + hFF (optimal, forward-only) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner astar --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== BiDij (Bidirectional Dijkstra, cost-aware optimal) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bidij --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== NBS + hFF (Near-Optimal Bidirectional Search) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== BAE* + hFF (Bidirectional A* with Error) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --stats examples/pddl/gripper.pddl"

  example:compare:nbs-heuristics:
    desc: Solve gripper-4 with NBS using hFF, hMax, and h=0 side by side
    cmds:
      - echo "=== NBS + hFF (inadmissible, fast) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --heuristic hff --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== NBS + hMax (admissible, provably optimal) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --heuristic hmax --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== NBS + h=0 (degenerates to bidirectional Dijkstra) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner nbs --heuristic zero --stats examples/pddl/gripper.pddl"

  example:compare:bae-heuristics:
    desc: Solve gripper-4 with BAE* using hFF, hMax, and h=0 side by side
    cmds:
      - echo "=== BAE* + hFF (inadmissible, fast) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --heuristic hff --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== BAE* + hMax (admissible heuristics both directions) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --heuristic hmax --stats examples/pddl/gripper.pddl"
      - echo ""
      - echo "=== BAE* + h=0 (degenerates to bidirectional Dijkstra) ==="
      - "{{.CARGO}} run --bin miniplan -- solve --planner bae --heuristic zero --stats examples/pddl/gripper.pddl"

  example:check:
    desc: Ground all example problems without searching
    cmds:
      - ls examples/pddl/*.pddl | xargs -I {} sh -c 'echo "--- {} ---"; {{.CARGO}} run --bin miniplan -- check "{}"; echo ""'

  run:
    desc: Launch the interactive TUI with all example PDDL files
    aliases:
      - tui
    cmds:
      - "{{.CARGO}} run --release --bin miniplan -- tui examples/pddl/*.pddl"


  docs:open:
    desc: Build rustdoc (and open them)
    aliases:
      - doc:open
    cmds:
      - cargo doc -p miniplan --no-deps --all-features --open
