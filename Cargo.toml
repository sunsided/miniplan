[workspace]
resolver = "2"
members = ["bins/miniplan-cli", "crates/miniplan"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/miniplan"
homepage = "https://sunsided.github.io/planning-and-search/crates/miniplan/"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
keywords = ["pddl", "planning", "ai", "scheduling"]
categories = ["science"]

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
fixedbitset = "0.5"
indexmap = "2"
miniplan = { version = "0.2.0", path = "crates/miniplan" }
pddl = "0.2.0"
pretty_assertions = "1"
proptest = "1.12"
criterion = "0.8.2"
rustc-hash = "2"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
# Safe by default. If a crate needs unsafe, use "deny" here instead and scope
# #[expect(unsafe_code, reason = "...")] to the smallest item (forbid cannot be overridden).
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
